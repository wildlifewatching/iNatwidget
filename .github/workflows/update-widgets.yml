
name: Update iNaturalist widgets

on:
  schedule:
    # 22:00 UTC daily = ~6am Perth (AWST, UTC+8). Adjust to taste.
    - cron: "0 22 * * *"
  workflow_dispatch: {} # lets you trigger a rebuild manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate widgets
        run: node scripts/build.mjs

      - name: Commit updated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "Update iNaturalist widgets"
          git push
